name: promote-verify
# Enhanced verification gate for develop -> main PROMOTION PRs only.
# main is the protected trunk; dev work lands on `develop` (gated by the lighter `rust`
# job in ci.yml). A develop->main PR additionally runs THIS workflow, which verifies the
# tree merges cleanly into main and is fully green + advisory-free before promotion.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: promote-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promote-verify:
    name: promote-verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify clean merge into main (no conflicts)
        run: |
          git config user.email ci@local && git config user.name ci
          git fetch origin main
          if ! git merge --no-commit --no-ff origin/main; then
            echo "::error::promotion PR does not merge cleanly into main"; exit 1
          fi
          git merge --abort 2>/dev/null || true

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Rust-native drift gate (Gemini)
        run: bash .gemini/skills/merge-verification/scripts/drift-check.sh .
      - name: Rust-native drift gate (Claude)
        run: bash .claude/skills/merge-verification/scripts/drift-check.sh .
      - name: Build (workspace, locked)
        run: cargo build --workspace --locked
      - name: Test (workspace, locked)
        run: cargo test --workspace --locked
      - name: IDD validation
        run: cargo run --bin rusty-idd -- validate --workspace .
      - name: IDD manifest refresh check
        run: |
          cargo run --bin rusty-idd -- manifest --workspace . --out .idd/MANIFEST.tsv
          git diff --exit-code -- .idd/MANIFEST.tsv
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Security audit (fails on any new advisory)
        run: cargo audit --deny warnings
