name: Promote Verify

# rusty-idd two-tier promote-verify gate: develop -> master must pass a clean-merge
# probe, locked build/test, drift, fmt/clippy, and cargo audit --deny warnings.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
name: promote-verify
# Enhanced verification gate for develop -> main PROMOTION PRs only.
# main is the protected trunk; dev work lands on `develop` (gated by the lighter `rust`
# job in ci.yml). A develop->main PR additionally runs THIS workflow, which verifies the
# tree merges cleanly into main and is fully green + advisory-free before promotion.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

env:
  CARGO_TERM_COLOR: always

jobs:
  merge-probe:
    name: Clean merge probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Probe develop -> master merge
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git fetch origin develop
          git checkout origin/master
          git merge --no-commit --no-ff origin/develop

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Mirror ci.yml's checkout layout: the repo lives under handoff/ so the
      # ledger/hf path deps (../../meta-ruvector, ../../envctl) resolve to sibling
      # clones at the workspace root.
      - uses: actions/checkout@v6
        with:
          path: handoff
      - name: Clone rvf-crypto provider (meta-ruvector)
        shell: bash
        run: git clone --depth 1 https://github.com/FlexNetOS/meta-ruvector.git meta-ruvector
      - name: Clone envctl provider (envctl)
        shell: bash
        run: |
          if [ "${RUNNER_OS:-}" = "Windows" ]; then
            mkdir -p envctl/crates/secrets-engine/src
            {
              printf '%s\n' '[package]'
              printf '%s\n' 'name = "envctl-secrets-engine"'
              printf '%s\n' 'version = "0.0.0"'
              printf '%s\n' 'edition = "2021"'
              printf '\n%s\n' '[lib]'
              printf '%s\n' 'name = "envctl_secrets"'
              printf '%s\n' 'path = "src/lib.rs"'
              printf '\n%s\n' '[features]'
              printf '%s\n' 'default = []'
              printf '%s\n' 'inmem-store = []'
            } > envctl/crates/secrets-engine/Cargo.toml
            printf '// Windows CI manifest-only stub; the optional secrets feature is not built here.\n' > envctl/crates/secrets-engine/src/lib.rs
          else
            git clone --depth 1 https://github.com/FlexNetOS/envctl.git envctl
          fi
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: handoff
      - name: Run tests
        working-directory: handoff
        run: cargo test --workspace

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: handoff
      - name: Clone rvf-crypto provider (meta-ruvector)
        run: git clone --depth 1 https://github.com/FlexNetOS/meta-ruvector.git meta-ruvector
      - name: Clone envctl provider (envctl)
        shell: bash
        run: |
          if [ "${RUNNER_OS:-}" = "Windows" ]; then
            mkdir -p envctl/crates/secrets-engine/src
            {
              printf '%s\n' '[package]'
              printf '%s\n' 'name = "envctl-secrets-engine"'
              printf '%s\n' 'version = "0.0.0"'
              printf '%s\n' 'edition = "2021"'
              printf '\n%s\n' '[lib]'
              printf '%s\n' 'name = "envctl_secrets"'
              printf '%s\n' 'path = "src/lib.rs"'
              printf '\n%s\n' '[features]'
              printf '%s\n' 'default = []'
              printf '%s\n' 'inmem-store = []'
            } > envctl/crates/secrets-engine/Cargo.toml
            printf '// Windows CI manifest-only stub; the optional secrets feature is not built here.\n' > envctl/crates/secrets-engine/src/lib.rs
          else
            git clone --depth 1 https://github.com/FlexNetOS/envctl.git envctl
          fi
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: handoff
      - name: Run clippy
        working-directory: handoff
        run: cargo clippy --workspace --all-targets -- -D warnings

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: handoff
      - name: Clone rvf-crypto provider (meta-ruvector)
        run: git clone --depth 1 https://github.com/FlexNetOS/meta-ruvector.git meta-ruvector
      - name: Clone envctl provider (envctl)
        shell: bash
        run: |
          if [ "${RUNNER_OS:-}" = "Windows" ]; then
            mkdir -p envctl/crates/secrets-engine/src
            {
              printf '%s\n' '[package]'
              printf '%s\n' 'name = "envctl-secrets-engine"'
              printf '%s\n' 'version = "0.0.0"'
              printf '%s\n' 'edition = "2021"'
              printf '\n%s\n' '[lib]'
              printf '%s\n' 'name = "envctl_secrets"'
              printf '%s\n' 'path = "src/lib.rs"'
              printf '\n%s\n' '[features]'
              printf '%s\n' 'default = []'
              printf '%s\n' 'inmem-store = []'
            } > envctl/crates/secrets-engine/Cargo.toml
            printf '// Windows CI manifest-only stub; the optional secrets feature is not built here.\n' > envctl/crates/secrets-engine/src/lib.rs
          else
            git clone --depth 1 https://github.com/FlexNetOS/envctl.git envctl
          fi
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: handoff
      - name: Check formatting
        working-directory: handoff
        run: cargo fmt -p hf -p ledger -p work-order -- --check

  drift:
    name: Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: handoff
      - name: Clone rvf-crypto provider (meta-ruvector)
        run: git clone --depth 1 https://github.com/FlexNetOS/meta-ruvector.git meta-ruvector
      - name: Clone envctl provider (envctl)
        shell: bash
        run: |
          if [ "${RUNNER_OS:-}" = "Windows" ]; then
            mkdir -p envctl/crates/secrets-engine/src
            {
              printf '%s\n' '[package]'
              printf '%s\n' 'name = "envctl-secrets-engine"'
              printf '%s\n' 'version = "0.0.0"'
              printf '%s\n' 'edition = "2021"'
              printf '\n%s\n' '[lib]'
              printf '%s\n' 'name = "envctl_secrets"'
              printf '%s\n' 'path = "src/lib.rs"'
              printf '\n%s\n' '[features]'
              printf '%s\n' 'default = []'
              printf '%s\n' 'inmem-store = []'
            } > envctl/crates/secrets-engine/Cargo.toml
            printf '// Windows CI manifest-only stub; the optional secrets feature is not built here.\n' > envctl/crates/secrets-engine/src/lib.rs
          else
            git clone --depth 1 https://github.com/FlexNetOS/envctl.git envctl
          fi
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: handoff
      - name: Build hf
        working-directory: handoff
        run: cargo build -p hf
      - name: Run hf drift
        working-directory: handoff
        run: ./target/debug/hf drift

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
concurrency:
  group: promote-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promote-verify:
    name: promote-verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify clean merge into main (no conflicts)
        run: |
          git config user.email ci@local && git config user.name ci
          git fetch origin main
          if ! git merge --no-commit --no-ff origin/main; then
            echo "::error::promotion PR does not merge cleanly into main"; exit 1
          fi
          git merge --abort 2>/dev/null || true

      - name: Resolve meta-owned Rust root
        id: rust-meta
        run: |
          meta_root="$(cd "$GITHUB_WORKSPACE/.." && pwd -P)/meta"
          mkdir -p "$meta_root/.env/rust" "$meta_root/.cache/rust"
          echo "meta_root=$meta_root" >> "$GITHUB_OUTPUT"

      - name: Restore meta-owned Rust tool cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.rust-meta.outputs.meta_root }}/.env/rust
            ${{ steps.rust-meta.outputs.meta_root }}/.cache/rust
          key: rusty-idd-envctl-rust-tools-promote-${{ runner.os }}-${{ hashFiles('scripts/ci/envctl-rust-env.sh', 'scripts/ci/envctl-rust-audit.sh') }}
          restore-keys: |
            rusty-idd-envctl-rust-tools-promote-${{ runner.os }}-

      - name: Restore workspace target cache
        uses: actions/cache@v4
        with:
          path: |
            target
          key: rusty-idd-target-promote-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'scripts/ci/envctl-rust-env.sh', 'scripts/ci/envctl-rust-audit.sh') }}
          restore-keys: |
            rusty-idd-target-promote-${{ runner.os }}-

      - name: Envctl Rust toolchain and cache
        env:
          RUSTY_IDD_META_ROOT: ${{ steps.rust-meta.outputs.meta_root }}
        run: scripts/ci/envctl-rust-env.sh promote

      - name: Strict envctl Rust toolchain audit
        run: scripts/ci/envctl-rust-audit.sh

      - name: Merge-tools verification gate
        run: cargo run --bin rusty-idd -- merge-tools verify --workspace .
      - name: Build (workspace, locked)
        run: cargo build --workspace --locked
      - name: Test (workspace, locked)
        run: cargo test --workspace --locked
      - name: IDD validation
        run: cargo run --bin rusty-idd -- validate --workspace .
      - name: IDD manifest refresh check
        run: |
          cargo run --bin rusty-idd -- manifest --workspace . --out .idd/MANIFEST.tsv
          git diff --exit-code -- .idd/MANIFEST.tsv
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Security audit (fails on any new advisory)
        run: cargo audit --deny warnings
