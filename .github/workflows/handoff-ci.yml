        run: handoff/scripts/ci/envctl-rust-env.sh release
      # Guards against optional-feature bit-rot: a stale path-dep crate name or an
      # ungated call site (e.g. the cognitum gate) compiles under default features but
      # breaks under `--all-features`/`--no-default-features`. CI ran neither all-features
      # build before, so the `secrets` seam silently rotted. Fail closed here instead.
