name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: handoff

      # ledger depends on rvf-crypto via a relative path
      # (../../meta-ruvector/crates/rvf/rvf-crypto from ledger/), mirroring the
      # meta workspace layout where meta-ruvector is the sibling checkout.
      - name: Clone rvf-crypto provider (meta-ruvector)
        shell: bash
        run: |
          # Sparse checkout avoids Windows-invalid paths in meta-ruvector (for example
          # `.codex/prompts/agents:agent-capabilities.md`) while preserving the exact
          # crates handoff path-depends on. Linux/macOS also use this path for parity.
          mkdir meta-ruvector
          git -C meta-ruvector init
          # Windows rejects colon-bearing paths anywhere in the fetched tree before
          # sparse-checkout has a chance to exclude them. Keep sparse parity and
          # disable only the Windows path-protection validation for this throwaway
          # provider checkout; skipped invalid paths are never materialized.
          git -C meta-ruvector config core.protectNTFS false
          git -C meta-ruvector remote add origin https://github.com/FlexNetOS/meta-ruvector.git
          git -C meta-ruvector sparse-checkout init --cone
          git -C meta-ruvector sparse-checkout set \
            crates/rvf \
            crates/ruvector-verified \
            crates/ruvector-domain-expansion \
            crates/cognitum-gate-tilezero
          git -C meta-ruvector fetch --depth 1 --filter=blob:none origin HEAD
          git -C meta-ruvector checkout --force FETCH_HEAD

      # HFTASK-0013/0017: optional path deps live in the sibling envctl/meta-ruvector checkouts.
      # CI only needs the manifests to resolve; default-feature builds do not compile envctl.
      - name: Clone envctl provider (envctl)
        shell: bash
        run: |
          if [ "${RUNNER_OS:-}" != "Linux" ]; then
            mkdir -p envctl/crates/secrets-engine/src
            {
              printf '%s\n' '[package]'
              printf '%s\n' 'name = "envctl-secrets-engine"'
              printf '%s\n' 'version = "0.0.0"'
              printf '%s\n' 'edition = "2021"'
              printf '\n%s\n' '[lib]'
              printf '%s\n' 'name = "envctl_secrets"'
              printf '%s\n' 'path = "src/lib.rs"'
              printf '\n%s\n' '[features]'
              printf '%s\n' 'default = []'
              printf '%s\n' 'inmem-store = []'
            } > envctl/crates/secrets-engine/Cargo.toml
            printf '// non-Linux CI manifest-only stub; handoff-secrets is tested on Linux with real envctl.\n' > envctl/crates/secrets-engine/src/lib.rs
          else
            git clone --depth 1 https://github.com/FlexNetOS/envctl.git envctl
          fi
          if [ ! -d loop_lib ]; then
            git clone --depth 1 https://github.com/FlexNetOS/loop_lib.git loop_lib
            perl -i -pe 's/^version\.workspace = true/version = "0.1.0"/; s/^edition\.workspace = true/edition = "2021"/; s/^license\.workspace = true/license = "MIT OR Apache-2.0"/; s{^repository\.workspace = true}{repository = "https://github.com/FlexNetOS/loop_lib"}' loop_lib/Cargo.toml
          fi

      # Meta-owned Rust toolchain/cache (replaces the removed Rust
      # setup/cache actions per the envctl toolchain-ownership contract).
      - name: Resolve meta-owned Rust root
        id: rust-meta
        shell: bash
        run: |
          meta_root="$GITHUB_WORKSPACE/meta"
          mkdir -p "$meta_root/.env/rust" "$meta_root/.cache/rust"
          echo "meta_root=$meta_root" >> "$GITHUB_OUTPUT"
      - name: Restore meta-owned Rust tool cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.rust-meta.outputs.meta_root }}/.env/rust
            ${{ steps.rust-meta.outputs.meta_root }}/.cache/rust
          key: rusty-idd-envctl-rust-tools-1.96.0-${{ runner.os }}-handoffci-test-${{ hashFiles('handoff/scripts/ci/envctl-rust-env.sh') }}
          restore-keys: |
            rusty-idd-envctl-rust-tools-1.96.0-${{ runner.os }}-handoffci-test-
      - name: Restore workspace target cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/handoff/target
          key: rusty-idd-target-1.96.0-${{ runner.os }}-handoffci-test-${{ hashFiles('handoff/Cargo.lock', 'handoff/scripts/ci/envctl-rust-env.sh') }}
          restore-keys: |
            rusty-idd-target-1.96.0-${{ runner.os }}-handoffci-test-
      - name: Envctl Rust toolchain and cache
        shell: bash
        env:
          RUSTY_IDD_META_ROOT: ${{ steps.rust-meta.outputs.meta_root }}
          RUSTY_IDD_RUST_TOOLCHAIN: 1.96.0
          CARGO_TARGET_DIR: ${{ github.workspace }}/handoff/target
        run: handoff/scripts/ci/envctl-rust-env.sh release
      - name: Run tests
        working-directory: handoff
        shell: bash
        run: |
          if [ "${RUNNER_OS:-}" = "Linux" ]; then
            # codegraph-parser: 9 complexity tests broken upstream at the pinned
            # tree-sitter (fail identically on pristine develop; previously un-gated).
            # Tracked for a real fix — see repo issue "codegraph-parser complexity suite".
            cargo test --workspace --exclude codegraph-parser
          else
            # handoff-secrets wraps envctl's broker and is validated on Linux with the real
            # envctl checkout. macOS/Windows use a manifest-only provider so ordinary
            # workspace tests still cover handoff without compiling envctl's OS-specific seam.
            cargo test --workspace --exclude handoff-secrets --exclude codegraph-parser
          fi

