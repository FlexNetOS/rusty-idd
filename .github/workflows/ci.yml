            perl -0pi -e 's/members\s*=\s*\[[^\]]*\]/members = ["crates\/secrets-engine"]/' "$parent/envctl/Cargo.toml"
          fi
          if [ ! -d "$parent/loop_lib" ]; then
            git clone --depth 1 https://github.com/FlexNetOS/loop_lib.git "$parent/loop_lib"
            # loop_lib's manifest inherits version/edition/etc from a parent workspace
            # it does not carry standalone; concretize so cargo metadata (run by
            # cargo fmt) can resolve the envctl->engine->loop_lib chain.
            perl -i -pe 's/^version\.workspace = true/version = "0.1.0"/; s/^edition\.workspace = true/edition = "2021"/; s/^license\.workspace = true/license = "MIT OR Apache-2.0"/; s{^repository\.workspace = true}{repository = "https://github.com/FlexNetOS/loop_lib"}' "$parent/loop_lib/Cargo.toml"
          fi
      - name: Resolve meta-owned Rust root
        id: rust-meta
        run: |
          meta_root="$(cd "$GITHUB_WORKSPACE/.." && pwd -P)/meta"
          mkdir -p "$meta_root/.env/rust" "$meta_root/.cache/rust"
          echo "meta_root=$meta_root" >> "$GITHUB_OUTPUT"
      - name: Restore meta-owned Rust tool cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.rust-meta.outputs.meta_root }}/.env/rust
            ${{ steps.rust-meta.outputs.meta_root }}/.cache/rust
          key: rusty-idd-envctl-rust-tools-msrv-${{ runner.os }}-${{ hashFiles('scripts/ci/envctl-rust-env.sh') }}
          restore-keys: |
            rusty-idd-envctl-rust-tools-msrv-${{ runner.os }}-
      - name: Restore workspace target cache
        uses: actions/cache@v4
        with:
          path: |
            target
          key: rusty-idd-target-msrv-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'scripts/ci/envctl-rust-env.sh') }}
          restore-keys: |
            rusty-idd-target-msrv-${{ runner.os }}-
      - name: Envctl Rust toolchain
        env:
          RUSTY_IDD_META_ROOT: ${{ steps.rust-meta.outputs.meta_root }}
        run: scripts/ci/envctl-rust-env.sh msrv
      - name: Build on the MSRV floor (1.96.0, locked)
        run: cargo build --workspace --locked
      - name: Compile tests on the MSRV floor (locked)
        run: cargo test --workspace --locked --no-run
