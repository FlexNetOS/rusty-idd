name: ci

# Workspace-level CI for the rusty-idd Cargo workspace.
# Relocated from intent-driven-development/.github/ (GitHub only runs workflows
# under the repo-root .github/) and upgraded to run across the whole workspace.
#
# All gates are blocking: the merge-tools verification gate, build, test, fmt,
# clippy (-D warnings), and a cargo-audit supply-chain gate. The fmt+clippy
# cleanup slice formatted both crates and cleared all lints, so these are now
# enforced. The audit gate fails on any NEW advisory (see .cargo/audit.toml).
#
# Rust state is owned by the parent-shaped meta/envctl prefix created by
# scripts/ci/envctl-rust-env.sh, not by user-global rustup/Cargo homes or Rust
# setup/cache actions. The `rust` job runs the full gate on latest nightly with
# the strict `rustc_codegen_gcc` + wild + kache/hurry/zccache contract; the
# `msrv` job proves the declared 1.96 floor still builds with meta-local Rust
# (raised from 1.88 by the fork unification: the handoff kernel declares rust-version 1.96).
# homes.

on:
  workflow_call:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Fork-unification (PR #143): the handoff kernel members (ledger, handoff-*)
      # path-depend on sibling checkouts, mirroring the meta workspace layout.
      # Provision them beside $GITHUB_WORKSPACE exactly as handoff-ci.yml does.
      - name: Provision sibling providers (meta-ruvector + envctl)
        shell: bash
        run: |
          parent="$(cd "$GITHUB_WORKSPACE/.." && pwd -P)"
          if [ ! -d "$parent/meta-ruvector/.git" ]; then
            mkdir -p "$parent/meta-ruvector"
            git -C "$parent/meta-ruvector" init
            git -C "$parent/meta-ruvector" config core.protectNTFS false
            git -C "$parent/meta-ruvector" remote add origin https://github.com/FlexNetOS/meta-ruvector.git
            git -C "$parent/meta-ruvector" sparse-checkout init --cone
            git -C "$parent/meta-ruvector" sparse-checkout set \
              crates/rvf \
              crates/ruvector-verified crates/ruvector-domain-expansion \
              crates/cognitum-gate-tilezero \
              crates/ruvector-core crates/ruvector-coherence \
              crates/ruvector-cognitive-container patches/hnsw_rs
            git -C "$parent/meta-ruvector" fetch --depth 1 --filter=blob:none origin HEAD
            git -C "$parent/meta-ruvector" checkout --force FETCH_HEAD
            # The cone still carries the ROOT workspace manifest, whose members list
            # spans ~150 crates; cargo metadata (run by cargo fmt) fails on the first
            # member absent from the cone (ruvector-temporal-coherence). Trim members
            # to the cone's path-dep closure (same pattern as the envctl trim below).
            # crates/rvf is its own workspace (root excludes it) so it is not listed.
            perl -0pi -e 's/\nmembers = \[.*?\n\]/\nmembers = [\n    "crates\/ruvector-verified",\n    "crates\/ruvector-domain-expansion",\n    "crates\/cognitum-gate-tilezero",\n    "crates\/ruvector-core",\n    "crates\/ruvector-coherence",\n    "crates\/ruvector-cognitive-container",\n]/s' "$parent/meta-ruvector/Cargo.toml"
            # cargo fmt --all also formats local path dependencies, so the throwaway
            # sibling's fmt drift would fail OUR Format gate. The sibling's fmt is
            # meta-ruvector's business (and that repo is on operator hold) — ignore
            # the whole tree via rustfmt.toml (nightly rustfmt honors `ignore`).
            printf 'ignore = ["/"]\n' > "$parent/meta-ruvector/rustfmt.toml"
          fi
          if [ ! -d "$parent/envctl" ]; then
            git clone --depth 1 https://github.com/FlexNetOS/envctl.git "$parent/envctl"
            # rusty-idd only path-deps envctl-secrets-engine (self-contained). Trim the
            # throwaway clone's workspace members to just it so cargo metadata (run by
            # cargo fmt) stops resolving envctl's OTHER members and their external
            # path-deps (engine->loop_lib, cli->meta_plugin_protocol, ...).
            perl -0pi -e 's/members\s*=\s*\[[^\]]*\]/members = ["crates\/secrets-engine"]/' "$parent/envctl/Cargo.toml"
          fi
          if [ ! -d "$parent/loop_lib" ]; then
            git clone --depth 1 https://github.com/FlexNetOS/loop_lib.git "$parent/loop_lib"
            # loop_lib's manifest inherits version/edition/etc from a parent workspace
            # it does not carry standalone; concretize so cargo metadata (run by
            # cargo fmt) can resolve the envctl->engine->loop_lib chain.
            perl -i -pe 's/^version\.workspace = true/version = "0.1.0"/; s/^edition\.workspace = true/edition = "2021"/; s/^license\.workspace = true/license = "MIT OR Apache-2.0"/; s{^repository\.workspace = true}{repository = "https://github.com/FlexNetOS/loop_lib"}' "$parent/loop_lib/Cargo.toml"
          fi
      - name: Resolve meta-owned Rust root
        id: rust-meta
        run: |
          meta_root="$(cd "$GITHUB_WORKSPACE/.." && pwd -P)/meta"
          mkdir -p "$meta_root/.env/rust" "$meta_root/.cache/rust"
          echo "meta_root=$meta_root" >> "$GITHUB_OUTPUT"
      - name: Restore meta-owned Rust tool cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.rust-meta.outputs.meta_root }}/.env/rust
            ${{ steps.rust-meta.outputs.meta_root }}/.cache/rust
          key: rusty-idd-envctl-rust-tools-nightly-${{ runner.os }}-${{ hashFiles('scripts/ci/envctl-rust-env.sh', 'scripts/ci/envctl-rust-audit.sh') }}
          restore-keys: |
            rusty-idd-envctl-rust-tools-nightly-${{ runner.os }}-
      - name: Restore workspace target cache
        uses: actions/cache@v4
        with:
          path: |
            target
          key: rusty-idd-target-nightly-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'scripts/ci/envctl-rust-env.sh', 'scripts/ci/envctl-rust-audit.sh') }}
          restore-keys: |
            rusty-idd-target-nightly-${{ runner.os }}-
      - name: Envctl Rust toolchain and cache
        env:
          RUSTY_IDD_META_ROOT: ${{ steps.rust-meta.outputs.meta_root }}
        run: scripts/ci/envctl-rust-env.sh ci
      - name: Strict envctl Rust toolchain audit
        run: scripts/ci/envctl-rust-audit.sh
      - name: Merge-tools verification gate
        run: cargo run --bin rusty-idd -- merge-tools verify --workspace .
      - name: Build (workspace)
        run: cargo build --workspace --locked
      - name: Test (workspace)
        # codegraph-parser's complexity suite is broken upstream at the pinned
        # tree-sitter (fails identically on pristine develop; tracked in #144).
        run: cargo test --workspace --locked --exclude codegraph-parser
      - name: IDD validation
        run: cargo run --bin rusty-idd -- validate --workspace .
      - name: IDD manifest refresh check
        run: |
          cargo run --bin rusty-idd -- manifest --workspace . --out .idd/MANIFEST.tsv
          git diff --exit-code -- .idd/MANIFEST.tsv
      - name: Vendor adapter drift gate (ADR-0010/0015)
        run: cargo run --bin rusty-idd -- render --all --check
      - name: ADR ledger collision gate (ADR-0016)
        # Fails closed on any NEW duplicate ADR number. The four accepted
        # historical collisions (0002/0004/0005/0006) are a frozen baseline and
        # are reported but do not fail; see ADR-0016.
        run: cargo run --bin rusty-idd -- spec adr list --check
      - name: Fleet-deploy self-check (ADR-0017)
        # The home repo's thin-adapter surface must stay in sync: adapters match
        # `render`, and the front-door SessionStart hook is present.
        run: cargo run --bin rusty-idd -- deploy --target . --all --check
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Security audit (fails on any new advisory)
        # Fail-closed supply-chain gate. The shared baseline (.cargo/audit.toml) is
        # auto-loaded and ignores the two accepted unmaintained transitive advisories
        # (backlog A3). `--deny warnings` turns any *new* unmaintained/unsound/yanked
        # advisory into a failure too. The `time` DoS vuln (RUSTSEC-2026-0009) was
        # remediated by backlog A2 (time >=0.3.47), so it no longer needs an ignore —
        # the gate now enforces vulnerabilities with zero exceptions.
        run: cargo audit --deny warnings

  # MSRV floor: proves the workspace still builds on its declared minimum supported
  # Rust version (the per-crate `rust-version` = 1.96, the edition-2024 + let-chains
  # + time/ratatui floor). If a change raises the real MSRV, this job goes red until
  # the `rust-version` fields + this pin are bumped together. Build-only (lints/tests
  # run on the pinned `rust` job above).
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Fork-unification (PR #143): the handoff kernel members (ledger, handoff-*)
      # path-depend on sibling checkouts, mirroring the meta workspace layout.
      # Provision them beside $GITHUB_WORKSPACE exactly as handoff-ci.yml does.
      - name: Provision sibling providers (meta-ruvector + envctl)
        shell: bash
        run: |
          parent="$(cd "$GITHUB_WORKSPACE/.." && pwd -P)"
          if [ ! -d "$parent/meta-ruvector/.git" ]; then
            mkdir -p "$parent/meta-ruvector"
            git -C "$parent/meta-ruvector" init
            git -C "$parent/meta-ruvector" config core.protectNTFS false
            git -C "$parent/meta-ruvector" remote add origin https://github.com/FlexNetOS/meta-ruvector.git
            git -C "$parent/meta-ruvector" sparse-checkout init --cone
            git -C "$parent/meta-ruvector" sparse-checkout set \
              crates/rvf \
              crates/ruvector-verified crates/ruvector-domain-expansion \
              crates/cognitum-gate-tilezero \
              crates/ruvector-core crates/ruvector-coherence \
              crates/ruvector-cognitive-container patches/hnsw_rs
            git -C "$parent/meta-ruvector" fetch --depth 1 --filter=blob:none origin HEAD
            git -C "$parent/meta-ruvector" checkout --force FETCH_HEAD
            # The cone still carries the ROOT workspace manifest, whose members list
            # spans ~150 crates; cargo metadata (run by cargo fmt) fails on the first
            # member absent from the cone (ruvector-temporal-coherence). Trim members
            # to the cone's path-dep closure (same pattern as the envctl trim below).
            # crates/rvf is its own workspace (root excludes it) so it is not listed.
            perl -0pi -e 's/\nmembers = \[.*?\n\]/\nmembers = [\n    "crates\/ruvector-verified",\n    "crates\/ruvector-domain-expansion",\n    "crates\/cognitum-gate-tilezero",\n    "crates\/ruvector-core",\n    "crates\/ruvector-coherence",\n    "crates\/ruvector-cognitive-container",\n]/s' "$parent/meta-ruvector/Cargo.toml"
            # cargo fmt --all also formats local path dependencies, so the throwaway
            # sibling's fmt drift would fail OUR Format gate. The sibling's fmt is
            # meta-ruvector's business (and that repo is on operator hold) — ignore
            # the whole tree via rustfmt.toml (nightly rustfmt honors `ignore`).
            printf 'ignore = ["/"]\n' > "$parent/meta-ruvector/rustfmt.toml"
          fi
          if [ ! -d "$parent/envctl" ]; then
            git clone --depth 1 https://github.com/FlexNetOS/envctl.git "$parent/envctl"
            # rusty-idd only path-deps envctl-secrets-engine (self-contained). Trim the
            # throwaway clone's workspace members to just it so cargo metadata (run by
