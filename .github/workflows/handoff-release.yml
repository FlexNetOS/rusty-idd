name: Release

on:
  push:
    tags:
      - 'v*'
  repository_dispatch:
    types: [release-tagged]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            binary_name: hf
            asset_name: hf-darwin-x64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            binary_name: hf
            asset_name: hf-darwin-arm64.tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary_name: hf
            asset_name: hf-linux-x64.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            binary_name: hf
            asset_name: hf-linux-arm64.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary_name: hf.exe
            asset_name: hf-windows-x64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Clone rvf-crypto provider (meta-ruvector)
        shell: bash
        run: git clone --depth 1 https://github.com/FlexNetOS/meta-ruvector.git meta-ruvector

      # Meta-owned Rust toolchain (replaces the removed Rust setup action per the envctl
      # toolchain-ownership contract). This job checks out at the repo root, so the
      # script and lockfile are root-relative and CARGO_TARGET_DIR keeps its default
      # (<workspace>/target), matching the package step's target/<triple>/release path.
      - name: Resolve meta-owned Rust root
        id: rust-meta
        shell: bash
        run: |
          meta_root="$(cd "$GITHUB_WORKSPACE/.." && pwd -P)/meta"
          mkdir -p "$meta_root/.env/rust" "$meta_root/.cache/rust"
          echo "meta_root=$meta_root" >> "$GITHUB_OUTPUT"
      - name: Restore meta-owned Rust tool cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.rust-meta.outputs.meta_root }}/.env/rust
            ${{ steps.rust-meta.outputs.meta_root }}/.cache/rust
          key: rusty-idd-envctl-rust-tools-1.96.0-${{ runner.os }}-release-${{ matrix.target }}-${{ hashFiles('scripts/ci/envctl-rust-env.sh') }}
          restore-keys: |
            rusty-idd-envctl-rust-tools-1.96.0-${{ runner.os }}-release-${{ matrix.target }}-
      - name: Restore workspace target cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ github.workspace }}/target
          key: rusty-idd-target-1.96.0-${{ runner.os }}-release-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'scripts/ci/envctl-rust-env.sh') }}
          restore-keys: |
            rusty-idd-target-1.96.0-${{ runner.os }}-release-${{ matrix.target }}-
      - name: Envctl Rust toolchain
        shell: bash
        env:
          RUSTY_IDD_META_ROOT: ${{ steps.rust-meta.outputs.meta_root }}
          RUSTY_IDD_RUST_TOOLCHAIN: 1.96.0
        run: scripts/ci/envctl-rust-env.sh release
      - name: Add release target to the meta-owned toolchain
        shell: bash
        run: rustup target add ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          cat >> .cargo/config.toml << EOF
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p hf

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/
          cd dist
          tar -czvf ../${{ matrix.asset_name }} *
          cd ..
          shasum -a 256 ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          copy target\${{ matrix.target }}\release\${{ matrix.binary_name }} dist\
          cd dist
          7z a -tzip ..\${{ matrix.asset_name }} *
          cd ..
          certutil -hashfile ${{ matrix.asset_name }} SHA256 > ${{ matrix.asset_name }}.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get-tag.outputs.tag }}
    steps:
      - name: Get tag name
        id: get-tag
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "tag=${{ github.event.client_payload.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.sha256" \) -exec cp {} release/ \;
          cd release
          cat *.sha256 > checksums.txt

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get-tag.outputs.tag }}
          files: release/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
