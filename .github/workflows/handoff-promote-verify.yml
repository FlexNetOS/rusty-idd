name: Promote Verify

# rusty-idd two-tier promote-verify gate: develop -> master must pass a clean-merge
# probe, locked build/test, drift, fmt/clippy, and cargo audit --deny warnings.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  CARGO_TERM_COLOR: always

jobs:
  merge-probe:
    name: Clean merge probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Probe develop -> master merge
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git fetch origin develop
          git checkout origin/master
          git merge --no-commit --no-ff origin/develop

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Mirror ci.yml's checkout layout: the repo lives under handoff/ so the
      # ledger/hf path deps (../../meta-ruvector, ../../envctl) resolve to sibling
      # clones at the workspace root.
      - uses: actions/checkout@v6
        with:
          path: handoff
      - name: Clone rvf-crypto provider (meta-ruvector)
        shell: bash
        run: git clone --depth 1 https://github.com/FlexNetOS/meta-ruvector.git meta-ruvector
      - name: Clone envctl provider (envctl)
        shell: bash
        run: |
          if [ "${RUNNER_OS:-}" = "Windows" ]; then
            mkdir -p envctl/crates/secrets-engine/src
            {
              printf '%s\n' '[package]'
              printf '%s\n' 'name = "envctl-secrets-engine"'
              printf '%s\n' 'version = "0.0.0"'
              printf '%s\n' 'edition = "2021"'
              printf '\n%s\n' '[lib]'
              printf '%s\n' 'name = "envctl_secrets"'
              printf '%s\n' 'path = "src/lib.rs"'
              printf '\n%s\n' '[features]'
              printf '%s\n' 'default = []'
              printf '%s\n' 'inmem-store = []'
            } > envctl/crates/secrets-engine/Cargo.toml
            printf '// Windows CI manifest-only stub; the optional secrets feature is not built here.\n' > envctl/crates/secrets-engine/src/lib.rs
          else
            git clone --depth 1 https://github.com/FlexNetOS/envctl.git envctl
          fi
      # Meta-owned Rust toolchain/cache (replaces the removed Rust
      # setup/cache actions per the envctl toolchain-ownership contract).
      - name: Resolve meta-owned Rust root
        id: rust-meta
        shell: bash
        run: |
          meta_root="$GITHUB_WORKSPACE/meta"
          mkdir -p "$meta_root/.env/rust" "$meta_root/.cache/rust"
          echo "meta_root=$meta_root" >> "$GITHUB_OUTPUT"
      - name: Restore meta-owned Rust tool cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.rust-meta.outputs.meta_root }}/.env/rust
            ${{ steps.rust-meta.outputs.meta_root }}/.cache/rust
          key: rusty-idd-envctl-rust-tools-1.96.0-${{ runner.os }}-promote-test-${{ hashFiles('handoff/scripts/ci/envctl-rust-env.sh') }}
          restore-keys: |
            rusty-idd-envctl-rust-tools-1.96.0-${{ runner.os }}-promote-test-
      - name: Restore workspace target cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/handoff/target
          key: rusty-idd-target-1.96.0-${{ runner.os }}-promote-test-${{ hashFiles('handoff/Cargo.lock', 'handoff/scripts/ci/envctl-rust-env.sh') }}
          restore-keys: |
            rusty-idd-target-1.96.0-${{ runner.os }}-promote-test-
      - name: Envctl Rust toolchain and cache
        shell: bash
        env:
          RUSTY_IDD_META_ROOT: ${{ steps.rust-meta.outputs.meta_root }}
          RUSTY_IDD_RUST_TOOLCHAIN: 1.96.0
          CARGO_TARGET_DIR: ${{ github.workspace }}/handoff/target
        run: handoff/scripts/ci/envctl-rust-env.sh release
      - name: Run tests
        working-directory: handoff
        run: cargo test --workspace

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: handoff
      - name: Clone rvf-crypto provider (meta-ruvector)
        run: git clone --depth 1 https://github.com/FlexNetOS/meta-ruvector.git meta-ruvector
      - name: Clone envctl provider (envctl)
        shell: bash
        run: |
          if [ "${RUNNER_OS:-}" = "Windows" ]; then
            mkdir -p envctl/crates/secrets-engine/src
            {
              printf '%s\n' '[package]'
              printf '%s\n' 'name = "envctl-secrets-engine"'
              printf '%s\n' 'version = "0.0.0"'
              printf '%s\n' 'edition = "2021"'
              printf '\n%s\n' '[lib]'
              printf '%s\n' 'name = "envctl_secrets"'
              printf '%s\n' 'path = "src/lib.rs"'
              printf '\n%s\n' '[features]'
              printf '%s\n' 'default = []'
              printf '%s\n' 'inmem-store = []'
            } > envctl/crates/secrets-engine/Cargo.toml
            printf '// Windows CI manifest-only stub; the optional secrets feature is not built here.\n' > envctl/crates/secrets-engine/src/lib.rs
          else
            git clone --depth 1 https://github.com/FlexNetOS/envctl.git envctl
          fi
      # Meta-owned Rust toolchain/cache (replaces the removed Rust
      # setup/cache actions per the envctl toolchain-ownership contract).
      - name: Resolve meta-owned Rust root
        id: rust-meta
        shell: bash
        run: |
          meta_root="$GITHUB_WORKSPACE/meta"
          mkdir -p "$meta_root/.env/rust" "$meta_root/.cache/rust"
          echo "meta_root=$meta_root" >> "$GITHUB_OUTPUT"
      - name: Restore meta-owned Rust tool cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.rust-meta.outputs.meta_root }}/.env/rust
            ${{ steps.rust-meta.outputs.meta_root }}/.cache/rust
          key: rusty-idd-envctl-rust-tools-1.96.0-${{ runner.os }}-promote-clippy-${{ hashFiles('handoff/scripts/ci/envctl-rust-env.sh') }}
          restore-keys: |
            rusty-idd-envctl-rust-tools-1.96.0-${{ runner.os }}-promote-clippy-
      - name: Restore workspace target cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/handoff/target
          key: rusty-idd-target-1.96.0-${{ runner.os }}-promote-clippy-${{ hashFiles('handoff/Cargo.lock', 'handoff/scripts/ci/envctl-rust-env.sh') }}
          restore-keys: |
            rusty-idd-target-1.96.0-${{ runner.os }}-promote-clippy-
      - name: Envctl Rust toolchain and cache
        shell: bash
        env:
          RUSTY_IDD_META_ROOT: ${{ steps.rust-meta.outputs.meta_root }}
          RUSTY_IDD_RUST_TOOLCHAIN: 1.96.0
          CARGO_TARGET_DIR: ${{ github.workspace }}/handoff/target
        run: handoff/scripts/ci/envctl-rust-env.sh release
      - name: Add clippy to the meta-owned toolchain
        shell: bash
        run: rustup component add clippy
      - name: Run clippy
        working-directory: handoff
        run: cargo clippy --workspace --all-targets -- -D warnings

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: handoff
      - name: Clone rvf-crypto provider (meta-ruvector)
        run: git clone --depth 1 https://github.com/FlexNetOS/meta-ruvector.git meta-ruvector
      - name: Clone envctl provider (envctl)
        shell: bash
        run: |
          if [ "${RUNNER_OS:-}" = "Windows" ]; then
            mkdir -p envctl/crates/secrets-engine/src
            {
              printf '%s\n' '[package]'
              printf '%s\n' 'name = "envctl-secrets-engine"'
              printf '%s\n' 'version = "0.0.0"'
              printf '%s\n' 'edition = "2021"'
              printf '\n%s\n' '[lib]'
              printf '%s\n' 'name = "envctl_secrets"'
              printf '%s\n' 'path = "src/lib.rs"'
              printf '\n%s\n' '[features]'
              printf '%s\n' 'default = []'
              printf '%s\n' 'inmem-store = []'
            } > envctl/crates/secrets-engine/Cargo.toml
            printf '// Windows CI manifest-only stub; the optional secrets feature is not built here.\n' > envctl/crates/secrets-engine/src/lib.rs
          else
            git clone --depth 1 https://github.com/FlexNetOS/envctl.git envctl
          fi
      # Meta-owned Rust toolchain (replaces the removed Rust
      # setup/cache actions per the envctl toolchain-ownership contract).
      # fmt does not compile, so no target cache.
      - name: Resolve meta-owned Rust root
        id: rust-meta
        shell: bash
        run: |
          meta_root="$GITHUB_WORKSPACE/meta"
          mkdir -p "$meta_root/.env/rust" "$meta_root/.cache/rust"
          echo "meta_root=$meta_root" >> "$GITHUB_OUTPUT"
      - name: Restore meta-owned Rust tool cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.rust-meta.outputs.meta_root }}/.env/rust
            ${{ steps.rust-meta.outputs.meta_root }}/.cache/rust
          key: rusty-idd-envctl-rust-tools-1.96.0-${{ runner.os }}-promote-format-${{ hashFiles('handoff/scripts/ci/envctl-rust-env.sh') }}
          restore-keys: |
            rusty-idd-envctl-rust-tools-1.96.0-${{ runner.os }}-promote-format-
      - name: Envctl Rust toolchain
        shell: bash
        env:
          RUSTY_IDD_META_ROOT: ${{ steps.rust-meta.outputs.meta_root }}
          RUSTY_IDD_RUST_TOOLCHAIN: 1.96.0
          CARGO_TARGET_DIR: ${{ github.workspace }}/handoff/target
        run: handoff/scripts/ci/envctl-rust-env.sh release
      - name: Add rustfmt to the meta-owned toolchain
        shell: bash
        run: rustup component add rustfmt
      - name: Check formatting
        working-directory: handoff
        run: cargo fmt -p hf -p ledger -p work-order -- --check

  drift:
    name: Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: handoff
      - name: Clone rvf-crypto provider (meta-ruvector)
        run: git clone --depth 1 https://github.com/FlexNetOS/meta-ruvector.git meta-ruvector
      - name: Clone envctl provider (envctl)
        shell: bash
        run: |
          if [ "${RUNNER_OS:-}" = "Windows" ]; then
            mkdir -p envctl/crates/secrets-engine/src
            {
              printf '%s\n' '[package]'
              printf '%s\n' 'name = "envctl-secrets-engine"'
              printf '%s\n' 'version = "0.0.0"'
              printf '%s\n' 'edition = "2021"'
              printf '\n%s\n' '[lib]'
              printf '%s\n' 'name = "envctl_secrets"'
              printf '%s\n' 'path = "src/lib.rs"'
              printf '\n%s\n' '[features]'
              printf '%s\n' 'default = []'
              printf '%s\n' 'inmem-store = []'
            } > envctl/crates/secrets-engine/Cargo.toml
            printf '// Windows CI manifest-only stub; the optional secrets feature is not built here.\n' > envctl/crates/secrets-engine/src/lib.rs
          else
            git clone --depth 1 https://github.com/FlexNetOS/envctl.git envctl
          fi
      # Meta-owned Rust toolchain/cache (replaces the removed Rust
      # setup/cache actions per the envctl toolchain-ownership contract).
      # CARGO_TARGET_DIR is pinned under handoff/ so `./target/debug/hf` resolves.
      - name: Resolve meta-owned Rust root
        id: rust-meta
        shell: bash
        run: |
          meta_root="$GITHUB_WORKSPACE/meta"
          mkdir -p "$meta_root/.env/rust" "$meta_root/.cache/rust"
          echo "meta_root=$meta_root" >> "$GITHUB_OUTPUT"
      - name: Restore meta-owned Rust tool cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.rust-meta.outputs.meta_root }}/.env/rust
            ${{ steps.rust-meta.outputs.meta_root }}/.cache/rust
          key: rusty-idd-envctl-rust-tools-1.96.0-${{ runner.os }}-promote-drift-${{ hashFiles('handoff/scripts/ci/envctl-rust-env.sh') }}
          restore-keys: |
            rusty-idd-envctl-rust-tools-1.96.0-${{ runner.os }}-promote-drift-
      - name: Restore workspace target cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/handoff/target
          key: rusty-idd-target-1.96.0-${{ runner.os }}-promote-drift-${{ hashFiles('handoff/Cargo.lock', 'handoff/scripts/ci/envctl-rust-env.sh') }}
          restore-keys: |
            rusty-idd-target-1.96.0-${{ runner.os }}-promote-drift-
      - name: Envctl Rust toolchain and cache
        shell: bash
        env:
          RUSTY_IDD_META_ROOT: ${{ steps.rust-meta.outputs.meta_root }}
          RUSTY_IDD_RUST_TOOLCHAIN: 1.96.0
          CARGO_TARGET_DIR: ${{ github.workspace }}/handoff/target
        run: handoff/scripts/ci/envctl-rust-env.sh release
      - name: Build hf
        working-directory: handoff
        run: cargo build -p hf
      - name: Run hf drift
        working-directory: handoff
        run: ./target/debug/hf drift

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
