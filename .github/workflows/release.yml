name: Release

on:
  push:
    tags:
      - 'v*'
  repository_dispatch:
    types: [release-tagged]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    name: Build ${{ matrix.suffix }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            binary_name: hf
            asset_name: hf-darwin-x64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            binary_name: hf
            asset_name: hf-darwin-arm64.tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary_name: hf
            asset_name: hf-linux-x64.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            binary_name: hf
            asset_name: hf-linux-arm64.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary_name: hf.exe
            asset_name: hf-windows-x64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Clone rvf-crypto provider (meta-ruvector)
        shell: bash
        run: git clone --depth 1 https://github.com/FlexNetOS/meta-ruvector.git meta-ruvector

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          cat >> .cargo/config.toml << EOF
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p hf

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/
          cd dist
          tar -czvf ../${{ matrix.asset_name }} *
          cd ..
          shasum -a 256 ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          copy target\${{ matrix.target }}\release\${{ matrix.binary_name }} dist\
          cd dist
          7z a -tzip ..\${{ matrix.asset_name }} *
          cd ..
          certutil -hashfile ${{ matrix.asset_name }} SHA256 > ${{ matrix.asset_name }}.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get-tag.outputs.tag }}
    steps:
      - name: Get tag name
        id: get-tag
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "tag=${{ github.event.client_payload.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.sha256" \) -exec cp {} release/ \;
          cd release
          cat *.sha256 > checksums.txt

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get-tag.outputs.tag }}
          files: release/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          - os: ubuntu-latest
            suffix: linux-x86_64
            exe: ""
          - os: ubuntu-24.04-arm
            suffix: linux-aarch64
            exe: ""
          - os: macos-13
            suffix: macos-x86_64
            exe: ""
          - os: macos-14
            suffix: macos-aarch64
            exe: ""
          - os: windows-latest
            suffix: windows-x86_64
            exe: ".exe"
    steps:
      - uses: actions/checkout@v7
      - name: Resolve meta-owned Rust root
        id: rust-meta
        shell: bash
        run: |
          meta_root="$(cd "$GITHUB_WORKSPACE/.." && pwd -P)/meta"
          mkdir -p "$meta_root/.env/rust" "$meta_root/.cache/rust"
          echo "meta_root=$meta_root" >> "$GITHUB_OUTPUT"
      - name: Restore meta-owned Rust tool cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.rust-meta.outputs.meta_root }}/.env/rust
            ${{ steps.rust-meta.outputs.meta_root }}/.cache/rust
          key: rusty-idd-envctl-rust-tools-release-${{ runner.os }}-${{ matrix.suffix }}-${{ hashFiles('scripts/ci/envctl-rust-env.sh') }}
          restore-keys: |
            rusty-idd-envctl-rust-tools-release-${{ runner.os }}-${{ matrix.suffix }}-
            rusty-idd-envctl-rust-tools-release-${{ runner.os }}-
      - name: Restore workspace target cache
        uses: actions/cache@v4
        with:
          path: |
            target
          key: rusty-idd-target-release-${{ runner.os }}-${{ matrix.suffix }}-${{ hashFiles('Cargo.lock', 'scripts/ci/envctl-rust-env.sh') }}
          restore-keys: |
            rusty-idd-target-release-${{ runner.os }}-${{ matrix.suffix }}-
            rusty-idd-target-release-${{ runner.os }}-
      - name: Envctl Rust toolchain
        env:
          RUSTY_IDD_META_ROOT: ${{ steps.rust-meta.outputs.meta_root }}
        shell: bash
        run: scripts/ci/envctl-rust-env.sh release
      - name: Build release binary
        run: cargo build --workspace --locked --release --bin rusty-idd
      - name: Stage asset
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/rusty-idd${{ matrix.exe }}" "dist/rusty-idd-${{ matrix.suffix }}${{ matrix.exe }}"
      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
