[package]
name = "codegraph-core"
version = "1.0.0"
edition = "2021"
authors = ["CodeGraph Team"]
license = "MIT OR Apache-2.0"
description = "Core types and traits for the CodeGraph system"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bincode = { version = "2.0", features = ["serde"] }
bumpalo = "3.15"
bytes = "1"
chacha20poly1305 = { version = "0.10", features = ["std"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "cargo", "env", "wrap_help"] }
colored = "3"
config = "0.15"
crossbeam-channel = "0.5"
dashmap = "6"
dirs = "6"
futures = "0.3"
hashbrown = "0.17"
indicatif = "0.18"
memmap2 = "0.9"
notify = "8"
num_cpus = "1"
once_cell = "1"
parking_lot = "0.12"
rand = "0.9"
rkyv = { version = "0.8", features = ["alloc", "std"] }
rustc-hash = "2"
schemars = "1"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tikv-jemallocator = { version = "0.7", optional = true }
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
zstd = "0.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    # GetCurrentProcess for PrefetchVirtualMemory (windows-sys >=0.60 renamed
    # _WIN32_MEMORY_RANGE_ENTRY -> WIN32_MEMORY_RANGE_ENTRY and made HANDLE a pointer).
    "Win32_System_Threading",
] }

[dev-dependencies]
criterion = "0.8"
tempfile = "3"
tokio-test = "0.4"

[features]
default = []
jemalloc = ["dep:tikv-jemallocator"]
