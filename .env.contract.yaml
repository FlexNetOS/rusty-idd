runtime:
  secrets_required: false
  optional_env:
    - name: RUST_LOG
      secret: false
      purpose: Optional local logging filter.
    - name: NO_COLOR
      secret: false
      purpose: Optional plain-output hint.

ci_release:
  secrets:
    - name: GITHUB_TOKEN
      required: true
      provider: github-actions
      purpose: Automatic token for PR checks, release-please fallback, and release asset upload.
    - name: PARENT_REPO_PAT
      required: false
      provider: github-actions
      purpose: Optional release-please token when GITHUB_TOKEN-created PRs cannot trigger required workflows.
